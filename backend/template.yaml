AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smooy CRM backend - Customers/Staff data and API

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        CUSTOMERS_TABLE: !Ref CustomersTable
        STAFF_TABLE: !Ref StaffTable

Resources:
  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: smooy-customers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: phone
          KeyType: HASH

  StaffTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: smooy-staff
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  SmooyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  EnrollCustomerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: enrollCustomer.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
      Events:
        Enroll:
          Type: Api
          Properties:
            RestApiId: !Ref SmooyApi
            Path: /customers
            Method: POST

  GetCustomerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getCustomer.handler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CustomersTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref SmooyApi
            Path: /customers/{phone}
            Method: GET

  AddStampFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: addStamp.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
      Events:
        AddStamp:
          Type: Api
          Properties:
            RestApiId: !Ref SmooyApi
            Path: /customers/{phone}/stamps
            Method: POST

  UpdateRewardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateReward.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
      Events:
        UpdateReward:
          Type: Api
          Properties:
            RestApiId: !Ref SmooyApi
            Path: /customers/{phone}/rewards/{rewardId}
            Method: PATCH

Outputs:
  ApiUrl:
    Description: Base URL for the Smooy API
    Value: !Sub "https://${SmooyApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CustomersTableName:
    Value: !Ref CustomersTable
  StaffTableName:
    Value: !Ref StaffTable
